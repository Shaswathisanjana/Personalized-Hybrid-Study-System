[tool.poetry]
name = "phss-research-agent"
version = "0.1.0"
description = "PHSS Research Assistant — Multi-Agent AI Module"
authors = ["PHSS Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python               = "^3.11"

fastapi              = "^0.111.0"
uvicorn              = {extras = ["standard"], version = "^0.30.0"}
langgraph            = "^0.2.0"
langchain            = "^0.3.0"
# FREE LLM: Google Gemini (primary)
langchain-google-genai = "^2.0.0"
langchain-community  = "^0.3.0"
chromadb             = "^0.5.0"
pydantic             = "^2.7.0"
pydantic-settings    = "^2.2.0"
pymupdf              = "^1.24.0"
pdfplumber           = "^0.11.0"
arxiv                = "^2.1.0"
httpx                = "^0.27.0"
requests             = "^2.32.0"
python-docx          = "^1.1.0"
weasyprint           = "^62.0"
markdown             = "^3.6"
python-dotenv        = "^1.0.0"
tenacity             = "^8.3.0"
streamlit            = "^1.35.0"

[tool.poetry.group.dev.dependencies]
pytest         = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx          = "^0.27.0"
ruff           = "^0.4.0"
mypy           = "^1.10.0"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict         = false
ignore_missing_imports = true
